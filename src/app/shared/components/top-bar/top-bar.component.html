<header
  class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"
>
  <div
    class="h-20 px-margin-mobile flex items-center justify-between gap-gutter-mobile"
  >
    <div class="flex items-center gap-space-sm min-w-0">
      <button
        *ngIf="showBackButton"
        (click)="goBack()"
        aria-label="Regresar"
        class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-md text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all flex-shrink-0"
      >
        <span class="material-symbols-outlined text-[20px]">arrow_back</span>
      </button>
      <div class="flex flex-col min-w-0">
        <div class="flex items-center gap-space-xs">
          <span
            class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight truncate"
            >TRÍA</span
          ><span
            class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse flex-shrink-0"
          ></span>
        </div>
        <span
          class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant truncate"
          >{{ subtitle }}</span
        >
      </div>
    </div>
    <div class="flex items-center gap-space-sm flex-shrink-0">
      <button
        aria-label="Notificaciones"
        class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-md text-on-surface-variant hover:text-on-surface active:scale-95 transition-all"
      >
        <span class="material-symbols-outlined text-[20px]">notifications</span>
      </button>
      <a
        routerLink="/app/configuracion"
        aria-label="Configuración de la Boutique"
        class="w-8 h-8 rounded-full bg-primary flex items-center justify-center active:scale-95 transition-transform cursor-pointer shadow-sm hover:opacity-90"
      >
        <span class="material-symbols-outlined text-on-primary text-[18px]"
          >person</span
        >
      </a>
    </div>
  </div>
</header>
