<header
  class="fixed top-0 inset-x-0 z-50 transition-all duration-300 backdrop-blur-xl bg-surface/75 border-b border-primary-fixed-dim/30 shadow-[0_4px_30px_rgba(127,80,71,0.06)]"
  style="
    background-color: rgba(248, 213, 220, 0.5);
    backdrop-filter: blur(20px);
  "
>
  <div
    class="w-full px-gutter-mobile lg:px-margin h-20 flex items-center justify-between gap-space-md mx-auto max-w-[1440px]"
  >
    <div class="flex items-center gap-space-md">
      <a
        class="flex items-center gap-space-sm group focus:outline-none cursor-pointer"
        href="#inicio"
        (click)="scrollToSection($event, '#inicio')"
        aria-label="Ir al inicio — TRÍA Boutique"
      >
        <div class="flex flex-col">
          <span
            class="font-headline-sm text-headline-sm tracking-widest text-on-surface uppercase"
            >TRÍA</span
          ><span
            class="font-label-sm text-label-sm tracking-[0.25em] text-outline uppercase -mt-1"
            >Boutique</span
          >
        </div></a
      >
    </div>
    <nav
      class="hidden xl:flex items-center gap-space-lg"
      aria-label="Navegación principal"
    >
      @for (item of navItems; track item.label) {
        <a
          [attr.aria-current]="item.isPageAnchor ? 'page' : null"
          [class]="item.isPageAnchor 
            ? 'uppercase tracking-[0.16em] transition-colors py-space-xs text-primary font-semibold border-b border-primary cursor-pointer' 
            : 'font-label-md text-label-md uppercase tracking-[0.16em] text-on-surface-variant hover:text-primary transition-colors py-space-xs cursor-pointer'"
          [href]="item.href"
          (click)="scrollToSection($event, item.href)"
          >{{ item.label }}</a
        >
      }
    </nav>
    <div class="flex items-center gap-space-md">
      <a
        class="hidden sm:inline-flex items-center justify-center px-space-md py-space-sm bg-inverse-surface text-inverse-on-surface font-label-md text-label-md uppercase tracking-[0.16em] rounded transition-all duration-300 hover:bg-primary hover:text-on-primary border border-outline-variant/40 shadow-sm"
        href="https://wa.me/573011979357"
        rel="noopener noreferrer"
        target="_blank"
        aria-label="Contactar a Concierge de TRÍA por WhatsApp"
        >Concierge</a
      ><button
        id="menu-toggle"
        (click)="toggleMobileMenu()"
        class="xl:hidden flex items-center justify-center w-9 h-9 rounded-full text-on-surface hover:bg-surface-container transition-colors"
        aria-label="Abrir menú de navegación"
      >
        <span
          class="material-symbols-outlined text-[22px]"
          aria-hidden="true"
          >{{ isMobileMenuOpen ? "close" : "menu" }}</span
        >
      </button>
      <a
        routerLink="/login"
        class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-[0_2px_10px_rgba(127,80,71,0.25)] cursor-pointer"
        aria-label="Acceder a mi cuenta"
      >
        <span
          class="material-symbols-outlined text-on-primary text-[18px]"
          aria-hidden="true"
          >person</span
        >
      </a>
    </div>
  </div>
</header>
<nav
  id="mobile-menu"
  [class.hidden]="!isMobileMenuOpen"
  [class.flex]="isMobileMenuOpen"
  class="xl:hidden fixed top-20 inset-x-0 z-40 bg-surface/98 backdrop-blur-2xl border-b border-primary-fixed-dim/40 shadow-2xl px-6 py-6 flex-col gap-1 overflow-y-auto"
  style="max-height: calc(100vh - 5rem)"
  aria-label="Menú de navegación móvil"
>
  @for (item of navItems; track item.label) {
    <a
      [class]="item.isPageAnchor 
        ? 'flex items-center justify-between font-body-lg text-lg sm:text-xl uppercase tracking-[0.16em] text-primary font-semibold py-4 border-b border-primary/20 cursor-pointer transition-all duration-200' 
        : 'flex items-center justify-between font-body-lg text-base sm:text-lg uppercase tracking-[0.16em] text-on-surface hover:text-primary py-4 border-b border-surface-container/70 cursor-pointer transition-all duration-200 group'"
      [href]="item.href"
      (click)="scrollToSection($event, item.href)"
    >
      <span>{{ item.label }}</span>
      <span
        class="material-symbols-outlined text-[18px] opacity-40 group-hover:opacity-100 group-hover:translate-x-1 transition-all duration-200"
        aria-hidden="true"
        >arrow_forward_ios</span
      >
    </a>
  }
  <a
    class="mt-4 w-full inline-flex items-center justify-center gap-2 px-6 py-4 bg-inverse-surface text-inverse-on-surface font-body-lg text-sm sm:text-base uppercase tracking-[0.18em] font-semibold rounded shadow-md transition-all duration-300 hover:bg-primary hover:text-on-primary active:scale-[0.99]"
    href="https://wa.me/573011979357"
    rel="noopener noreferrer"
    target="_blank"
    (click)="closeMobileMenu()"
    aria-label="Contactar a Concierge de TRÍA por WhatsApp"
  >
    <span>Concierge</span>
    <span class="material-symbols-outlined text-[18px]" aria-hidden="true">chat</span>
  </a>
</nav>
